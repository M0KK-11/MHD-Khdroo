<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mhd Khair Khdroo — Flutter Developer portfolio." />
  <title>Mhd Khair Khdroo | Flutter Developer</title>
  <script>
    (function () {
      try {
        var scheme = localStorage.getItem('mhd-color-scheme');
        if (scheme !== 'light' && scheme !== 'dark') {
          scheme = 'dark';
        }
        document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
      } catch (e) {
        document.documentElement.setAttribute('data-mantine-color-scheme', 'dark');
      }
    })();
  </script>
  <style>
    /* Ensure root is above the canvas */
    #root {
      position: relative;
      z-index: 1;
    }

    /* The canvas scene styling */
    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
    }

    canvas#scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      display: block;
      pointer-events: none;
    }
  </style>
  <!-- Three.js Import Map -->
  <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.143.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.143.0/examples/jsm/"
        }
      }
    </script>
</head>

<body>
  <canvas id="scene"></canvas>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Cosmic Dust Script -->
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.143.0/build/three.module.js';
    import { EffectComposer } from 'https://unpkg.com/three@0.143.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://unpkg.com/three@0.143.0/examples/jsm/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'https://unpkg.com/three@0.143.0/examples/jsm/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'https://unpkg.com/three@0.143.0/examples/jsm/postprocessing/ShaderPass.js';
    import { GammaCorrectionShader } from 'https://unpkg.com/three@0.143.0/examples/jsm/shaders/GammaCorrectionShader.js';
    import { CopyShader } from 'https://unpkg.com/three@0.143.0/examples/jsm/shaders/CopyShader.js';

    function hexToVec3(hex) {
      const n = parseInt(hex.slice(1), 16);
      return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
    }

    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGL1Renderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.VSMShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.Fog(0x000000, 0, 22);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 80);
    camera.position.set(0, 0, 3);
    scene.add(camera);

    const LAYERS = { NONE: 0, TORUS_SCENE: 1, BLOOM_SCENE: 2, ENTIRE_SCENE: 3 };
    camera.layers.enable(LAYERS.TORUS_SCENE);
    camera.layers.enable(LAYERS.BLOOM_SCENE);
    camera.layers.enable(LAYERS.ENTIRE_SCENE);

    // Setup Postprocessing
    const renderPass = new RenderPass(scene, camera);

    const torusComposer = new EffectComposer(renderer);
    torusComposer.renderToScreen = false;
    torusComposer.addPass(renderPass);
    torusComposer.addPass(new ShaderPass(GammaCorrectionShader));
    torusComposer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.3, 0.3, 0));
    torusComposer.addPass(new ShaderPass(CopyShader));

    const bloomComposer = new EffectComposer(renderer);
    bloomComposer.renderToScreen = false;
    bloomComposer.addPass(renderPass);
    bloomComposer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.7, 0));
    bloomComposer.addPass(new ShaderPass(GammaCorrectionShader));

    const themeColors = {
      dark: {
        bg: hexToVec3('#0a1330'),
        flameA: hexToVec3('#2a70e4'),
        flameB: hexToVec3('#6c9eee'),
        flameAmt: 0.2,
        cool: hexToVec3('#1b65e2'),
        warm: hexToVec3('#9fc0f5'),
        maxAlpha: 0.68,
      },
      light: {
        bg: hexToVec3('#f5f8fd'),
        flameA: hexToVec3('#9fc0f5'),
        flameB: hexToVec3('#cfe0fc'),
        flameAmt: 0.08,
        cool: hexToVec3('#2a70e4'),
        warm: hexToVec3('#4382e8'),
        maxAlpha: 0.45,
      }
    };

    const initialScheme = document.documentElement.getAttribute('data-mantine-color-scheme') === 'light' ? 'light' : 'dark';
    const initialTheme = themeColors[initialScheme];

    const FinalPass = {
      uniforms: {
        iTime: { value: 0 },
        tDiffuse: { value: null },
        torusTexture: { value: null },
        bloomTexture: { value: null },
        haloTexture: { value: null },
        uBg: { value: initialTheme.bg.clone() },
        uFlameA: { value: initialTheme.flameA.clone() },
        uFlameB: { value: initialTheme.flameB.clone() },
        uFlameAmt: { value: initialTheme.flameAmt }
      },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,
      fragmentShader: `uniform float iTime; uniform sampler2D tDiffuse; uniform sampler2D bloomTexture; uniform sampler2D torusTexture; uniform sampler2D haloTexture;
uniform vec3 uBg; uniform vec3 uFlameA; uniform vec3 uFlameB; uniform float uFlameAmt;
varying vec2 vUv;
vec3 warp3d(vec3 pos, float t){ float curv=.8,a=1.9,b=0.7; pos*=2.;
  pos.x+=curv*sin(t+a*pos.y)+t*b; pos.y+=curv*cos(t+a*pos.x);
  pos.y+=curv*sin(t+a*pos.z)+t*b; pos.z+=curv*cos(t+a*pos.y);
  pos.z+=curv*sin(t+a*pos.x)+t*b; pos.x+=curv*cos(t+a*pos.z);
  return 0.5+0.5*cos(pos.xyz+vec3(1,2,4)); }
void main(){
  vec2 uv = 2.*vUv - 1.;
  vec3 w = pow(warp3d(vec3(uv.x, sin(uv.y), uv.y), iTime*1.5), vec3(1.5));
  vec3 flame = 1.5*uFlameA*w.x; flame*=w.y; flame += uFlameB*w.z;
  flame *= smoothstep(0.25, 1., abs(uv.y));
  float md = smoothstep(-0.7, 1., -uv.y*uv.x); flame *= md*md;
  vec3 bg = uBg * (1.0 - 0.4 * length(uv));
  vec3 halo = texture2D(haloTexture, vUv).xyz;
  gl_FragColor = vec4(bg + flame*uFlameAmt + texture2D(bloomTexture, vUv).xyz + texture2D(torusTexture, vUv).xyz + texture2D(tDiffuse, vUv).xyz + halo, 1.);
}`
    };

    const finalPass = new ShaderPass(FinalPass);
    finalPass.uniforms.bloomTexture.value = bloomComposer.renderTarget1.texture;
    finalPass.uniforms.torusTexture.value = torusComposer.renderTarget1.texture;

    const finalComposer = new EffectComposer(renderer);
    finalComposer.addPass(renderPass);
    finalComposer.addPass(finalPass);

    // Geometry & Material
    const count = 940;
    const positions = [], sizes = [];
    for (let i = 0; i < count; i++) {
      positions.push(2 * Math.random() - 1, 2 * Math.random() - 1, 2 * Math.random() - 1);
      sizes.push(25 + 25 * Math.random());
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

    const uniforms = {
      iTime: { value: 0 },
      iShift: { value: new THREE.Vector3() },
      iAlpha: { value: 0 },
      iAnimation: { value: new THREE.Vector3(0, 0, 0) },
      iResolution: { value: { x: window.innerWidth * window.devicePixelRatio, y: window.innerHeight * window.devicePixelRatio } },
      uDepth: { value: 3.7 },
      uCool: { value: initialTheme.cool.clone() },
      uWarm: { value: initialTheme.warm.clone() }
    };

    const material = new THREE.ShaderMaterial({
      uniforms,
      transparent: true,
      vertexShader: `attribute float size;
uniform float iTime;
uniform vec3 iShift;
uniform vec2 iResolution;
uniform vec3 iAnimation;
uniform float uDepth;
varying float transparency;
varying float warmness;
vec3 warp3d(vec3 pos, float t) {
  float curv = 0.9, a = 1.9, b = 0.25, b2 = 0.03, c = 0.02;
  pos *= 2.;
  pos.x += curv * sin(c * t + a * pos.y) + t * b2;
  pos.y += curv * cos(c * t + a * pos.x);
  pos.z += curv * cos(c * t + a * pos.y);
  pos.z += curv * sin(c * t + a * pos.x) + t * b;
  pos.z = abs(pos.z);
  return pos.xyz;
}
void main() {
  vec3 v = warp3d(position, iTime);
  // bigger uDepth spreads the field deeper → motes drift in from further away
  v = uDepth * (2. * fract(v + iShift) - 1.) + iAnimation;
  vec4 vpos = modelViewMatrix * vec4(v, 1.);
  transparency = step(length(v), uDepth);
  warmness = step(.75, fract(size * 7.13));
  gl_PointSize = size * iResolution.y / 1000. / -vpos.z;
  gl_Position = projectionMatrix * vpos;
}`,
      fragmentShader: `varying float transparency; varying float warmness;
uniform float iAlpha; uniform vec3 uCool; uniform vec3 uWarm;
void main() {
  vec3 color = mix(uCool * .8, uWarm * .8, warmness);
  float tex = smoothstep(1., .3, length(2. * gl_PointCoord - 1.));
  gl_FragColor = vec4(tex * color, tex * transparency * iAlpha);
}`
    });
    material.stencil = false;

    const points = new THREE.Points(geometry, material);
    points.position.set(0, 0, -1);
    points.layers.enable(LAYERS.ENTIRE_SCENE);
    scene.add(points);

    // Resize handler
    function onWindowResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const dpr = window.devicePixelRatio;

      renderer.setPixelRatio(dpr);
      renderer.setSize(w, h, false);

      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      torusComposer.setPixelRatio(dpr);
      torusComposer.setSize(w, h);

      bloomComposer.setPixelRatio(dpr);
      bloomComposer.setSize(w, h);

      finalComposer.setPixelRatio(dpr);
      finalComposer.setSize(w, h);

      uniforms.iResolution.value = { x: w * dpr, y: h * dpr };
    }
    window.addEventListener('resize', onWindowResize);
    onWindowResize();

    const start = performance.now();

    function render() {
      requestAnimationFrame(render);

      const time = performance.now();
      const elapsed = time - start;

      // Dynamic theme transition
      const currentScheme = document.documentElement.getAttribute('data-mantine-color-scheme') === 'light' ? 'light' : 'dark';
      const targetTheme = themeColors[currentScheme];

      finalPass.uniforms.uBg.value.lerp(targetTheme.bg, 0.08);
      finalPass.uniforms.uFlameA.value.lerp(targetTheme.flameA, 0.08);
      finalPass.uniforms.uFlameB.value.lerp(targetTheme.flameB, 0.08);
      finalPass.uniforms.uFlameAmt.value += (targetTheme.flameAmt - finalPass.uniforms.uFlameAmt.value) * 0.08;
      uniforms.uCool.value.lerp(targetTheme.cool, 0.08);
      uniforms.uWarm.value.lerp(targetTheme.warm, 0.08);

      let t = Math.min(elapsed / 2200, 1.0);
      let eased = t * t * t * (t * (t * 6 - 15) + 10);
      uniforms.iAlpha.value = eased * targetTheme.maxAlpha;

      const speed = 0.4;
      uniforms.iTime.value = time / 1000;
      uniforms.iShift.value.add(camera.position.clone().multiplyScalar(0.0022 * speed));

      finalPass.uniforms.iTime.value = time / 1000;

      camera.layers.set(LAYERS.TORUS_SCENE);
      torusComposer.render();

      camera.layers.set(LAYERS.BLOOM_SCENE);
      bloomComposer.render();

      camera.layers.set(LAYERS.ENTIRE_SCENE);
      finalComposer.render();
    }

    render();
  </script>
</body>

</html>
